[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "os-service-types"
description = "Python library for consuming OpenStack sevice-types-authority data"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pbr!=2.1.0,>=2.0.0", # Apache-2.0
]

[dependency-groups]
test = [
    "coverage!=4.4,>=4.0", # Apache-2.0
    "stestr>=2.0.0", # Apache-2.0
    "oslotest>=3.8.0", # Apache-2.0
    "testscenarios>=0.4", # Apache-2.0/BSD
    "requests-mock>=1.2.0", # Apache-2.0
    "keystoneauth1>=3.4.0", # Apache-2.0
]
doc = [
    "sphinx>=2.0.0,!=2.1.0", # BSD
    "openstackdocstheme>=2.2.1", # Apache-2.0
    "reno>=3.1.0", # Apache-2.0
]
types = [
    "mypy",
    "types-requests",
]

[project.urls]
Homepage = "https://docs.openstack.org/os-service-types/"
Repository = "https://opendev.org/openstack/os-service-types/"

[tool.setuptools.packages.find]
include = ["os_service_types"]

[tool.mypy]
python_version = "3.11"
show_column_numbers = true
show_error_context = true
strict = true
disable_error_code = ["import-untyped"]
exclude = "(?x)(doc | releasenotes)"

[[tool.mypy.overrides]]
module = ["os_service_types.tests.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "S", "UP"]
external = ["H"]
ignore = [
    # we only use asserts for type narrowing
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"os_service_types/tests/*" = ["S"]
