[tox]
minversion = 4.28.0
envlist = py3,pep8,docs

[testenv]
setenv =
  PYTHONWARNINGS=default::DeprecationWarning
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
dependency_groups =
  test
commands =
  stestr run --slowest {posargs}

[testenv:pep8]
description =
  Run style checks.
deps =
  pre-commit
dependency_groups =
  test
  types
commands =
  pre-commit run -a
  {[testenv:mypy]commands}

[testenv:mypy]
description =
  Run type checks.
dependency_groups =
  test
  types
commands =
  mypy --cache-dir="{envdir}/mypy_cache" {posargs:os_service_types}

[testenv:venv]
commands = {posargs}

[testenv:cover]
setenv =
  PYTHON=coverage run --source os_service_types --parallel-mode
commands =
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report

[testenv:docs]
dependency_groups =
  doc
commands =
  sphinx-build -a -E -W -b html -d doc/build/doctrees doc/source doc/build/html

[testenv:releasenotes]
dependency_groups =
  doc
commands =
  sphinx-build -a -E -W -b html -d releasenotes/build/doctrees releasenotes/source releasenotes/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[flake8]
show-source = true
builtins = _
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build

[hacking]
import_exceptions =
  typing
